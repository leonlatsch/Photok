name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

jobs:
  foss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Test
        run: bundle exec fastlane test_foss
      - name: Build
        run: bundle exec fastlane build_foss

  play:
    runs-on: ubuntu-latest
    # forked PRs have no access to the submodule deploy key, so skip them
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ssh-key: ${{ secrets.PRO_DEPLOY_KEY }}
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Test
        run: bundle exec fastlane test_play
      - name: Build
        run: bundle exec fastlane build_play
