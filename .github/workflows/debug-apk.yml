name: Build Debug APK

on:
  workflow_dispatch:          # kör manuellt från Actions-fliken
  push:
    branches:
      - '**'                  # valfritt: bygg automatiskt vid varje push

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build FOSS Debug APK
        run: bundle exec fastlane build_foss
        # Kör: ./gradlew assembleFossDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photok-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
